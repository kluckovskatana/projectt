<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Авторизація</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='/styles/style.css') }}">

</head>

<body>

    <div class="login">

        {% if logged_in %}

        <!-- ================= -->
        <!-- КОРИСТУВАЧ УВІЙШОВ -->
        <!-- ================= -->

        <h1>Вітаємо!</h1>

        <div class="success">
            Ви увійшли як <b>{{ user_name }}</b>
        </div>

        <a href="{{ url_for('logout') }}">
            <button type="button">
                Вийти
            </button>
        </a>


        {% else %}

        <!-- ================= -->
        <!-- ПЕРЕМИКАЧ -->
        <!-- ================= -->

        <div class="tabs">

            <button type="button" id="loginTab" onclick="showLogin()">
                Вхід
            </button>

            <button type="button" id="registerTab" onclick="showRegister()">
                Реєстрація
            </button>

        </div>


        <!-- ================= -->
        <!-- ПОВІДОМЛЕННЯ -->
        <!-- ================= -->

        {% with messages = get_flashed_messages() %}

        {% for message in messages %}

        <div class="error">
            {{ message }}
        </div>

        {% endfor %}

        {% endwith %}


        <!-- ================= -->
        <!-- ВХІД -->
        <!-- ================= -->

        <div id="loginForm">

            <h1>Увійти</h1>

            <form method="POST" action="{{ url_for('login') }}">

                <input type="hidden" name="action" value="login">

                <label for="loginName">
                    Ім'я
                </label>

                <input type="text" id="loginName" name="name" placeholder="Введіть ім'я" required>

                <label for="loginPassword">
                    Пароль
                </label>

                <input type="password" id="loginPassword" name="password" placeholder="Введіть пароль" required>

                <button type="submit">
                    Увійти
                </button>

            </form>

        </div>


        <!-- ================= -->
        <!-- РЕЄСТРАЦІЯ -->
        <!-- ================= -->

        <div id="registerForm" style="display: none;">

            <h1>Реєстрація</h1>

            <form method="POST" action="{{ url_for('login') }}">

                <input type="hidden" name="action" value="register">

                <label for="registerName">
                    Ім'я
                </label>

                <input type="text" id="registerName" name="name" placeholder="Придумайте ім'я" required>

                <label for="registerPassword">
                    Пароль
                </label>

                <input type="password" id="registerPassword" name="password" placeholder="Придумайте пароль" required>

                <label for="passwordConfirm">
                    Повторіть пароль
                </label>

                <input type="password" id="passwordConfirm" name="password_confirm" placeholder="Повторіть пароль"
                    required>

                <button type="submit">
                    Зареєструватися
                </button>

            </form>

        </div>

        {% endif %}

    </div>

    <script>

        function showLogin() {

            document.getElementById("loginForm").style.display = "block";
            document.getElementById("registerForm").style.display = "none";

            document.getElementById("loginTab").classList.add("active");
            document.getElementById("registerTab").classList.remove("active");

        }


        function showRegister() {

            document.getElementById("loginForm").style.display = "none";
            document.getElementById("registerForm").style.display = "block";

            document.getElementById("registerTab").classList.add("active");
            document.getElementById("loginTab").classList.remove("active");

        }


        // При відкритті сторінки активна вкладка "Вхід"
        showLogin();

    </script>


</body>

</html>
