<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Вхід</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background: #f3f4f6;
        }

        .login {
            width: 380px;
            padding: 35px;

            background: white;
            border-radius: 15px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #6366f1;
        }

        button {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 8px;

            background: #6366f1;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #4f46e5;
        }

        .error {
            padding: 10px;
            margin-bottom: 15px;

            background: #fee2e2;
            color: #991b1b;

            border-radius: 8px;
        }

        .success {
            padding: 10px;
            margin-bottom: 15px;

            background: #dcfce7;
            color: #166534;

            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="login">

    <h1>Увійти</h1>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <div class="error">
                {{ message }}
            </div>
        {% endfor %}
    {% endwith %}

    {% if success %}
        <div class="success">
            {{ success }}
        </div>
    {% endif %}

    <form method="POST">

        <label for="name">Ім'я</label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Введіть ім'я"
            required
        >

        <label for="password">Пароль</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Введіть пароль"
            required
        >

        <button type="submit">
            Увійти
        </button>

    </form>

</div>

</body>
</html>
